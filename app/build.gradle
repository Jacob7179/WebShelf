plugins { id 'com.android.application' }
android {
    namespace 'com.webshelf.app'
    compileSdk 35
    defaultConfig { applicationId 'com.webshelf.app'; minSdk 26; targetSdk 35; versionCode 31; versionName '1.30' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
dependencies { implementation 'com.google.android.gms:play-services-code-scanner:16.1.0' }





