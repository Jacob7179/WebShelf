<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WebShelf appearance test</title>
<style>
:root{color-scheme:light dark}body{font:18px system-ui;margin:24px;background:#f4f7f8;color:#142d3b}
@media(prefers-color-scheme:dark){body{background:#10191e;color:#e7eff2}}
</style>
<h1>Appearance test</h1>
<p id="mode"></p>
<p>Switch the app appearance through the ⋮ menu. This page should follow the selected theme on a compatible WebView.</p>
<script>
const preference=matchMedia('(prefers-color-scheme: dark)');
function update(){document.querySelector('#mode').textContent='Website color preference: '+(preference.matches?'dark':'light');}
preference.addEventListener('change',update);update();
</script>
</html>
